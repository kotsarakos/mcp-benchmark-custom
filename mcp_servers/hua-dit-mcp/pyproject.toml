[project]
name = "hua-dit-mcp"
version = "1.0.0"
description = "MCP server for the Department of Informatics and Telematics, Harokopio University of Athens"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
hua-dit-mcp = "hua_dit_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hua_dit_mcp"]

[tool.setuptools.package-data]
hua_dit_mcp = ["hua_data.json"]
